spring.application.name=SeaPlace

spring.datasource.url=jdbc:mysql://localhost:3306/seaplace?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Cada integrante tiene su propia contrasenia de MySQL: va en un archivo application-local.properties
# en la raiz del proyecto (al lado del pom.xml), que no se sube al repo. Lo que diga ese archivo
# pisa lo de este. Ver application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
application.security.jwt.secretKey: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration: 86400000

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Fotos subidas como archivo. El limite real (2 MB) lo valida FotoAnimalServiceImpl;
# este es el tope a partir del cual Spring rechaza el pedido sin llegar al service.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB